<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MeowD reader</title>
<style>
:root{
  --bg:#fff;--fg:#1f2328;--muted:#59636e;--border:#d1d9e0;--code-bg:#f6f8fa;
  --link:#0969da;--quote-fg:#59636e;--quote-bar:#d1d9e0;--stripe:#f6f8fa;
  --bar:#f6f8faf2;--btn:#fff;--btn-h:#eef1f4;--accent:#e0584f;
}
@media (prefers-color-scheme:dark){html:not([data-theme=light]){
  --bg:#0d1117;--fg:#e6edf3;--muted:#9198a1;--border:#30363d;--code-bg:#161b22;
  --link:#4493f8;--quote-fg:#9198a1;--quote-bar:#3d444d;--stripe:#161b22;
  --bar:#161b22f2;--btn:#21262d;--btn-h:#30363d;
}}
html[data-theme=dark]{
  --bg:#0d1117;--fg:#e6edf3;--muted:#9198a1;--border:#30363d;--code-bg:#161b22;
  --link:#4493f8;--quote-fg:#9198a1;--quote-bar:#3d444d;--stripe:#161b22;
  --bar:#161b22f2;--btn:#21262d;--btn-h:#30363d;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-size:16px;line-height:1.7;
  font-family:-apple-system,"Segoe UI","Malgun Gothic","Apple SD Gothic Neo",Helvetica,Arial,sans-serif}
.toolbar{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:8px;
  padding:8px 16px;background:var(--bar);backdrop-filter:blur(6px);border-bottom:1px solid var(--border)}
.brand{font-weight:600;font-size:14px;display:flex;align-items:center;gap:6px}
.brand .cat{color:var(--accent)}
.fname{font:12px ui-monospace,Consolas,monospace;color:var(--muted);overflow:hidden;
  text-overflow:ellipsis;white-space:nowrap;max-width:30%}
.sp{flex:1}
.btn{font-size:13px;color:var(--fg);background:var(--btn);border:1px solid var(--border);
  border-radius:6px;padding:5px 11px;cursor:pointer;line-height:1.4}
.btn:hover{background:var(--btn-h)}
.btn.primary{border-color:var(--accent);color:#fff;background:var(--accent)}
.btn.primary:hover{filter:brightness(1.05)}
#file{display:none}
.layout{display:flex;gap:24px;max-width:1140px;margin:0 auto;padding:0 24px;align-items:flex-start}
.toc{position:sticky;top:53px;flex:0 0 240px;max-height:calc(100vh - 70px);overflow:auto;
  padding:24px 0 40px;font-size:13.5px}
.toc .t{color:var(--muted);font-size:11px;letter-spacing:.04em;text-transform:uppercase;margin-bottom:8px;padding-left:6px}
.toc a{display:block;color:var(--muted);text-decoration:none;padding:3px 7px;border-radius:5px;margin:1px 0}
.toc a:hover{color:var(--fg);background:var(--code-bg)}
.toc a.lv3{padding-left:18px;font-size:13px}
body:not(.loaded) .toc,body.no-toc .toc,body.toc-hidden .toc{display:none}
@media (max-width:900px){.toc{display:none}}
.md{flex:1 1 auto;min-width:0;max-width:820px;padding:36px 0 96px}
.drop{max-width:560px;margin:14vh auto;padding:48px 28px;text-align:center;border:2px dashed var(--border);
  border-radius:16px;color:var(--muted)}
.drop h1{font-size:1.5em;color:var(--fg);margin:.2em 0 .4em}
.drop .cat{font-size:42px;color:var(--accent);line-height:1}
.drop p{margin:.4em 0}
body.loaded .drop{display:none}
body.dragging .drop{border-color:var(--accent);color:var(--fg)}
.md h1,.md h2,.md h3,.md h4{font-weight:600;line-height:1.3;margin:1.6em 0 .6em;scroll-margin-top:64px}
.md h1{font-size:1.9em;padding-bottom:.3em;border-bottom:1px solid var(--border);margin-top:0}
.md h2{font-size:1.5em;padding-bottom:.3em;border-bottom:1px solid var(--border)}
.md h3{font-size:1.25em}.md h4{font-size:1.05em}
.md p,.md ul,.md ol,.md blockquote,.md table,.md pre{margin:0 0 1em}
.md a{color:var(--link);text-decoration:none}.md a:hover{text-decoration:underline}
.md ul,.md ol{padding-left:1.6em}.md li{margin:.25em 0}
.md li.task-list-item{list-style:none;margin-left:-1.2em}.md li.task-list-item input{margin-right:.5em}
.md code{font-family:ui-monospace,Consolas,monospace;font-size:85%;background:var(--code-bg);padding:.2em .4em;border-radius:6px}
.md pre{background:var(--code-bg);padding:14px 16px;border-radius:8px;overflow-x:auto;border:1px solid var(--border)}
.md pre code{background:none;padding:0;font-size:88%}
.md blockquote{margin-left:0;padding:.2em 1em;color:var(--quote-fg);border-left:4px solid var(--quote-bar)}
.md hr{border:none;border-top:1px solid var(--border);margin:2em 0}
.md table{border-collapse:collapse;width:100%;display:block;overflow-x:auto}
.md th,.md td{border:1px solid var(--border);padding:6px 13px}.md tr:nth-child(2n){background:var(--stripe)}
.md img{max-width:100%}
@media print{.toolbar,.toc{display:none}.layout{display:block;padding:0;max-width:none}.md{max-width:none;padding:0}}
</style>
</head>
<body class="no-toc">
<div class="toolbar">
  <span class="brand"><span class="cat">&#128049;</span> MeowD reader</span>
  <span class="fname" id="fname"></span>
  <span class="sp"></span>
  <label class="btn primary" for="file">파일 열기</label>
  <input type="file" id="file" accept=".md,.markdown,.mdown,.mkd,text/markdown,text/plain">
  <button class="btn" type="button" onclick="toggleToc()">목차</button>
  <button class="btn" type="button" onclick="toggleTheme()">&#9681; 테마</button>
</div>
<div class="layout">
  <nav class="toc" id="toc"></nav>
  <main class="md" id="body">
    <div class="drop" id="drop">
      <div class="cat">&#128049;</div>
      <h1>MeowD reader</h1>
      <p><b>.md 파일을 여기에 끌어다 놓거나</b></p>
      <p>위 <b>파일 열기</b> 버튼으로 선택하세요.</p>
      <p style="font-size:13px;margin-top:1.4em">설치 불필요 · 오프라인 · 어떤 기기든 (폰·맥·PC)</p>
    </div>
  </main>
</div>
<script src="marked.min.js"></script>
<script>
const root=document.documentElement;
try{const t=localStorage.getItem('meowd-theme');if(t)root.setAttribute('data-theme',t);}catch(e){}
function toggleTheme(){const c=root.getAttribute('data-theme');
  const d=window.matchMedia&&matchMedia('(prefers-color-scheme:dark)').matches;
  const n=c==='dark'?'light':(c==='light'?'dark':(d?'light':'dark'));
  root.setAttribute('data-theme',n);try{localStorage.setItem('meowd-theme',n);}catch(e){}}
function toggleToc(){document.body.classList.toggle('toc-hidden');}
function slug(s,i){return 'h'+i;}
function buildToc(){
  const body=document.getElementById('body'),toc=document.getElementById('toc');
  const hs=body.querySelectorAll('h1,h2,h3');toc.innerHTML='';
  if(hs.length<2){document.body.classList.add('no-toc');return;}
  document.body.classList.remove('no-toc');
  let html='<div class="t">목차</div>';
  hs.forEach((h,i)=>{h.id=slug(h.textContent,i);
    const lv=h.tagName==='H3'?' lv3':'';
    html+='<a class="'+lv.trim()+'" href="#'+h.id+'">'+h.textContent.replace(/</g,'&lt;')+'</a>';});
  toc.innerHTML=html;
}
function render(text,name){
  if(window.marked){marked.setOptions({gfm:true,breaks:false});
    document.getElementById('body').innerHTML='<div class="drop" id="drop" style="display:none"></div>'+marked.parse(text);
  }else{document.getElementById('body').textContent=text;}
  document.getElementById('fname').textContent=name||'';
  document.body.classList.add('loaded');buildToc();window.scrollTo(0,0);
}
function readFile(f){if(!f)return;const r=new FileReader();r.onload=e=>render(e.target.result,f.name);r.readAsText(f,'utf-8');}
document.getElementById('file').addEventListener('change',e=>readFile(e.target.files[0]));
window.addEventListener('dragover',e=>{e.preventDefault();document.body.classList.add('dragging');});
window.addEventListener('dragleave',e=>{if(e.relatedTarget===null)document.body.classList.remove('dragging');});
window.addEventListener('drop',e=>{e.preventDefault();document.body.classList.remove('dragging');
  if(e.dataTransfer.files&&e.dataTransfer.files.length)readFile(e.dataTransfer.files[0]);});
</script>
</body>
</html>
